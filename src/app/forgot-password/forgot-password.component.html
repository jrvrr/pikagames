<div class="overlay">
  <div class="brutal-card modal-content">
    <button (click)="goBack()" class="close-btn brutal-btn red">X</button>
    <h2 class="auth-title">RECUPERAR CONTRASEÑA</h2>

    <p style="text-align: center; margin-bottom: 25px; font-weight: 700; color: var(--nin-dark);">Ingresa tu correo electrónico y te enviaremos un enlace.</p>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="auth-form">
      <div class="input-group">
        <label for="correo">Correo Electrónico</label>
        <input 
          type="email" 
          id="correo" 
          name="correo" 
          [(ngModel)]="correo" 
          class="brutal-input"
          required 
          placeholder="ejemplo@correo.com"
          [disabled]="isLoading">
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="mensaje" class="alert alert-success">
        {{ mensaje }}
      </div>

      <button type="submit" class="brutal-btn submit-btn" [disabled]="!forgotForm.form.valid || isLoading">
        {{ isLoading ? 'ENVIANDO...' : 'ENVIAR ENLACE' }}
      </button>

      <div class="toggle">
        <a href="javascript:void(0)" (click)="goBack()" class="toggle-link">
          VOLVER AL INICIO
        </a>
      </div>
    </form>
  </div>
</div>
