<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Recuperar Contraseña</h2>
      <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            [(ngModel)]="correo" 
            required 
            placeholder="ejemplo@correo.com"
            [disabled]="isLoading">
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="mensaje" class="alert alert-success">
        {{ mensaje }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="!forgotForm.form.valid || isLoading">
        <span *ngIf="!isLoading">Enviar Enlace</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="auth-footer">
        <a href="javascript:void(0)" (click)="goBack()" class="back-link">
          Volver al inicio
        </a>
      </div>
    </form>
  </div>
</div>
