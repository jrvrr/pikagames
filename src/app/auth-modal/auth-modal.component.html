<div class="overlay" (click)="cerrarModal()">
  <div class="brutal-card modal-content" (click)="$event.stopPropagation()">
    <button (click)="cerrarModal()" class="close-btn brutal-btn red">X</button>
    <h2 class="auth-title">{{ modo === 'login' ? 'INICIAR SESIÓN' : 'REGISTRARSE' }}</h2>

    <form (ngSubmit)="enviar()" class="auth-form">
      <div *ngIf="modo === 'register'" class="input-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" class="brutal-input" required placeholder="Tu nombre" maxlength="20" (blur)="validarNombre()" />
      </div>

      <div class="input-group">
        <label>Correo</label>
        <input type="email" [(ngModel)]="correo" name="correo" class="brutal-input" required placeholder="ejemplo@correo.com" maxlength="25" (blur)="validarCorreo()" />
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input [type]="mostrarContrasena ? 'text' : 'password'" 
                 [(ngModel)]="contrasena" 
                 name="contraseña" 
                 class="brutal-input" 
                 required 
                 placeholder="••••••••"
                 maxlength="10"
                 (blur)="validarContrasena()" />
          <button type="button" 
                  class="toggle-password-btn" 
                  (click)="mostrarContrasena = !mostrarContrasena"
                  tabindex="-1">
            <mat-icon>{{ mostrarContrasena ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="brutal-btn submit-btn" [disabled]="loading">
        {{ loading ? 'ENVIANDO...' : (modo === 'login' ? 'ENTRAR AHORA' : 'CREAR CUENTA') }}
      </button>
    </form>

    <p class="toggle">
      {{ modo === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
      <a href="#" class="toggle-link" (click)="alternarModo(); $event.preventDefault()">
        {{ modo === 'login' ? 'Regístrate aquí' : 'Inicia sesión' }}
      </a>
    </p>
  </div>
</div>
