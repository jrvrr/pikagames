<!-- Loading screen (se muestra al entrar, desaparece tras la animación) -->
<app-loading-screen *ngIf="showLoading" (loadingDone)="onLoadingDone()"></app-loading-screen>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" mode="over">
    <div class="sidenav-header">
      <img src="pikagames.jpg" alt="logo" class="logo-drawer" />
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/home" fragment="inicio" (click)="drawer.close()">Inicio</a>
      <a mat-list-item routerLink="/" fragment="preguntas-frecuentes" (click)="drawer.close()">Preguntas frecuentes</a>
      <a mat-list-item routerLink="/" fragment="contacto" (click)="drawer.close()">Contáctanos</a>
      <a mat-list-item [routerLink]="esAdmin ? '/admin' : '/compra'" (click)="drawer.close()">
        {{ esAdmin ? 'Panel Admin' : 'Compra de boletos' }}
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content #scrollContainer>
    <!-- Barra fija Opción B (Limpia y Moderna) -->
    <mat-toolbar class="toolbar fixed-toolbar nintendo-nav">
      <button
        type="button"
        mat-icon-button
        (click)="drawer.toggle()"
        class="menu-button icon-box"
      >
        <mat-icon fontIcon="menu" class="material-icons-outlined"></mat-icon>
      </button>

      <div class="brand-container">
        <img src="pikagames.jpg" alt="logo" class="logo" />
        <span class="brand-name">PIKA GAMES</span>
      </div>

      <span class="spacer"></span>

      <nav class="nav-links">
        <a routerLink="/" fragment="inicio" class="nav-link">Inicio</a>
        <a routerLink="/" fragment="preguntas-frecuentes" class="nav-link">Preguntas frecuentes</a>
        <a routerLink="/" fragment="contacto" class="nav-link">Contacto</a>
        <a [routerLink]="esAdmin ? '/admin' : '/compra'" class="nav-link btn-buy">
          {{ esAdmin ? 'Panel Admin' : 'Compra de boletos' }}
        </a>
      </nav>
    </mat-toolbar>

    <!-- Contenido principal -->
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
