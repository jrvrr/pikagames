<div class="overlay">
  <div class="brutal-card modal-content">
    <h2 class="auth-title">NUEVA CONTRASEÑA</h2>

    <p style="text-align: center; margin-bottom: 25px; font-weight: 700; color: var(--nin-dark);">Crea una nueva contraseña para tu cuenta.</p>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="auth-form">
      <div class="input-group">
        <label for="password">Nueva Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          class="brutal-input"
          required 
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          [disabled]="isLoading || !token">
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          class="brutal-input"
          required 
          placeholder="Confirma tu nueva contraseña"
          [disabled]="isLoading || !token">
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <button type="submit" class="brutal-btn submit-btn" [disabled]="!resetForm.form.valid || isLoading || !token">
        {{ isLoading ? 'ACTUALIZANDO...' : 'ACTUALIZAR CONTRASEÑA' }}
      </button>

      <div class="toggle">
        <a href="javascript:void(0)" (click)="goBack()" class="toggle-link">
          VOLVER AL INICIO
        </a>
      </div>
    </form>
  </div>
</div>
