<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Nueva Contraseña</h2>
      <p>Crea una nueva contraseña para tu cuenta.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="password">Nueva Contraseña</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            minlength="6"
            placeholder="Mínimo 6 caracteres"
            [disabled]="isLoading || !token">
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            required 
            placeholder="Confirma tu nueva contraseña"
            [disabled]="isLoading || !token">
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div *ngIf="mensaje" class="alert alert-success">
        {{ mensaje }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="!resetForm.form.valid || isLoading || !token">
        <span *ngIf="!isLoading">Actualizar Contraseña</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="auth-footer">
        <a href="javascript:void(0)" (click)="goBack()" class="back-link">
          Volver al inicio
        </a>
      </div>
    </form>
  </div>
</div>
